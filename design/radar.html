<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Синхрофазатрон — радар</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#11151c; --line:#232a35; --txt:#e7ecf5; --dim:#8b97a8;
    --acc:#5eead4; --acc2:#38bdf8; --warn:#fbbf24; --ok:#4ade80;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
       -webkit-font-smoothing:antialiased}
  .wrap{display:grid;grid-template-columns:minmax(320px,1fr) 340px;gap:0;height:100%;min-height:640px}
  /* ---------- radar ---------- */
  .scope{position:relative;display:flex;flex-direction:column;padding:22px 24px;overflow:hidden}
  .scope::before{content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 46%,rgba(94,234,212,.07),transparent 58%);
    pointer-events:none}
  .head{display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:2}
  .title{display:flex;align-items:baseline;gap:10px}
  .title h1{margin:0;font-size:17px;letter-spacing:.02em}
  .title span{color:var(--dim);font-size:12px}
  .search{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(94,234,212,.08),rgba(94,234,212,.02));
    color:var(--txt);border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit;font-size:12.5px}
  .search .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 0 rgba(94,234,212,.5)}
  .search.on .dot{background:var(--acc);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,234,212,.45)}70%{box-shadow:0 0 0 9px rgba(94,234,212,0)}100%{box-shadow:0 0 0 0 rgba(94,234,212,0)}}
  .stage{position:relative;flex:1;display:grid;place-items:center;min-height:380px;z-index:1}
  svg.radar{width:min(100%,520px);aspect-ratio:1;display:block}
  .ring{fill:none;stroke:var(--line);stroke-width:1}
  .ring.dash{stroke-dasharray:2 6;stroke:#2c3542}
  .cross{stroke:#1e2530;stroke-width:1}
  .ripple{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:0;
    transform-box:fill-box;transform-origin:center;animation:ripple 3.9s ease-out infinite}
  .ripple.d1{animation-delay:1.3s}
  .ripple.d2{animation-delay:2.6s}
  .ripple.paused{animation-play-state:paused;opacity:0}
  @keyframes ripple{0%{transform:scale(.12);opacity:.55}65%{opacity:.13}100%{transform:scale(1);opacity:0}}
  .blip{cursor:pointer;transition:filter .15s}
  .blip:hover{filter:brightness(1.35)}
  .blip circle.core{transition:r .2s}
  .label{fill:var(--dim);font-size:10.5px;letter-spacing:.03em}
  .self-label{fill:var(--txt);font-size:11px;font-weight:600}
  .empty-hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:var(--dim);font-size:12px}
  /* ---------- side ---------- */
  .side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .side header{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .side header b{font-size:13px}
  .side header div{color:var(--dim);font-size:11.5px;margin-top:2px}
  .scroll{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
  .peer{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0e1218;display:flex;flex-direction:column;gap:10px}
  .peer.sel{border-color:rgba(94,234,212,.55);box-shadow:0 0 0 1px rgba(94,234,212,.18) inset}
  .peer .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .peer .nm{font-weight:600;font-size:13px}
  .peer .meta{color:var(--dim);font-size:11.5px}
  .pill{font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:var(--ok);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.07)}
  .pill.warn{color:var(--warn);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.07)}
  .actions{display:flex;flex-wrap:wrap;gap:6px}
  button.act{border:1px solid var(--line);background:#141a22;color:var(--txt);border-radius:8px;
    padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
  button.act:hover{border-color:#3a4553;background:#182029}
  button.act.primary{border-color:rgba(94,234,212,.5);background:rgba(94,234,212,.13);color:#bff5ea;font-weight:600}
  input.code{width:100%;background:#0a0d12;border:1px solid var(--line);border-radius:8px;
    color:var(--txt);padding:6px 9px;font:inherit;font-size:12.5px;letter-spacing:.14em}
  .handoff{border:1px dashed rgba(94,234,212,.45);border-radius:10px;padding:10px;font-size:12px;color:#bff5ea;background:rgba(94,234,212,.06)}
  .handoff b{font-size:20px;letter-spacing:.22em;display:block;margin-top:4px}
  .log{margin:0;white-space:pre-wrap;color:var(--dim);font-size:11px;max-height:150px;overflow:auto}
  .k{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <section class="scope">
    <div class="head">
      <div class="title"><h1>Синхрофазатрон</h1><span id="me">macbook · algo</span></div>
      <button class="search on" id="search"><i class="dot"></i><span id="searchLabel">поиск идёт</span></button>
    </div>
    <div class="stage">
      <svg class="radar" viewBox="0 0 520 520" id="radar"></svg>
      <div class="empty-hint" id="hint">клик по метке — действия с машиной</div>
    </div>
  </section>

  <aside class="side">
    <header><b>На радаре</b><div id="count">2 устройства · 1 спарено</div></header>
    <div class="scroll" id="list"></div>
  </aside>
</div>

<script>
const W = 520, C = 260, R = 215;
const state = {
  search: true,
  me: { name: "macbook-pro-erkin-2", profile: "algo" },
  peers: [
    { name: "erkin-a520m-ds3h-v2", profile: "algo", addr: "192.168.88.251", paired: true, last: 2 },
    { name: "forge-laptop", profile: "forge", addr: "192.168.88.34", paired: false, last: 41 }
  ],
  selected: null,
  handoff: null,
  profiles: null,
  log: ""
};

const svg = document.getElementById("radar");
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}) => {
  const node = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
};

function angleFor(name) {           // stable pseudo-angle per machine name
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
}
function radiusFor(peer) {
  return peer.paired ? 96 : 150;
}

function draw() {
  svg.innerHTML = "";
  const defs = el("defs");
  const grad = el("linearGradient", { id: "sweepGrad", x1: "0", y1: "0", x2: "1", y2: "0" });
  grad.append(el("stop", { offset: "0%", "stop-color": "#5eead4", "stop-opacity": "0" }));
  grad.append(el("stop", { offset: "100%", "stop-color": "#5eead4", "stop-opacity": ".55" }));
  defs.append(grad);
  const glow = el("radialGradient", { id: "glow" });
  glow.append(el("stop", { offset: "0%", "stop-color": "#5eead4", "stop-opacity": ".35" }));
  glow.append(el("stop", { offset: "100%", "stop-color": "#5eead4", "stop-opacity": "0" }));
  defs.append(glow);
  svg.append(defs);

  svg.append(el("circle", { cx: C, cy: C, r: R + 22, fill: "url(#glow)" }));
  [0.42, 0.68, 1].forEach((k, i) =>
    svg.append(el("circle", { cx: C, cy: C, r: R * k, class: "ring" + (i === 0 ? " dash" : "") })));
  svg.append(el("line", { x1: C - R, y1: C, x2: C + R, y2: C, class: "cross" }));
  svg.append(el("line", { x1: C, y1: C - R, x2: C, y2: C + R, class: "cross" }));

  // expanding rings from the center
  [0, 1, 2].forEach((i) => {
    svg.append(el("circle", {
      cx: C, cy: C, r: R,
      class: "ripple" + (i ? " d" + i : "") + (state.search ? "" : " paused")
    }));
  });

  // self
  svg.append(el("circle", { cx: C, cy: C, r: 26, fill: "rgba(94,234,212,.10)" }));
  svg.append(el("circle", { cx: C, cy: C, r: 5, fill: "#5eead4" }));
  const selfText = el("text", { x: C, y: C + 44, "text-anchor": "middle", class: "self-label" });
  selfText.textContent = state.me.name;
  svg.append(selfText);

  // blips
  state.peers.forEach((peer) => {
    const a = (angleFor(peer.name) * Math.PI) / 180;
    const r = radiusFor(peer);
    const x = C + r * Math.cos(a), y = C + r * Math.sin(a);
    const color = peer.paired ? "#4ade80" : "#fbbf24";
    const blip = el("g", { class: "blip" });
    blip.append(el("circle", { cx: x, cy: y, r: 12, fill: color, opacity: ".10" }));
    blip.append(el("circle", { cx: x, cy: y, r: 4.5, fill: color }));
    const label = el("text", {
      x: x + (x > C ? 12 : -12), y: y + 3, "text-anchor": x > C ? "start" : "end", class: "label"
    });
    label.textContent = peer.name.length > 18 ? peer.name.slice(0, 17) + "…" : peer.name;
    blip.append(label);
    blip.addEventListener("click", () => { state.selected = peer.name; render(); });
    svg.append(blip);
  });
}

function render() {
  draw();
  document.getElementById("me").textContent = `${state.me.name} · ${state.me.profile}`;
  const searchBtn = document.getElementById("search");
  searchBtn.classList.toggle("on", state.search);
  document.getElementById("searchLabel").textContent = state.search ? "поиск идёт" : "поиск выкл";
  const paired = state.peers.filter((p) => p.paired).length;
  document.getElementById("count").textContent =
    `${state.peers.length} устройств · ${paired} спарено`;

  const list = document.getElementById("list");
  list.innerHTML = "";

  if (state.handoff) {
    const box = document.createElement("div");
    box.className = "handoff";
    box.innerHTML = `код для <b>${state.handoff.peer}</b><b>${state.handoff.code}</b>введи на другой машине`;
    list.append(box);
  }

  state.peers.forEach((peer) => {
    const card = document.createElement("div");
    card.className = "peer" + (state.selected === peer.name ? " sel" : "");
    card.innerHTML = `
      <div class="row">
        <div><div class="nm">${peer.name}</div>
          <div class="meta">${peer.profile} · ${peer.addr} · ${peer.last} с назад</div></div>
        <span class="pill ${peer.paired ? "ok" : "warn"}">${peer.paired ? "спарен" : "найден"}</span>
      </div>`;
    const actions = document.createElement("div");
    actions.className = "actions";

    const btn = (label, cls, fn) => {
      const b = document.createElement("button");
      b.className = "act " + cls;
      b.textContent = label;
      b.onclick = fn;
      actions.append(b);
    };

    if (peer.paired) {
      btn("План", "", () => (state.log = `план для ${peer.name}: 3 файла к отправке`));
      btn("Синхронизировать", "primary", () => (state.log = `синхронизировано с ${peer.name}: +2 файла`));
      btn("Диалоги", "", () => (state.log = `диалоги ${peer.name}: +12 чатов, +340 сообщений`));
      btn("Профили", "", () => {
        state.profiles = { peer: peer.name, items: [{ name: "algo", skills: 14, mb: 9 }, { name: "forge", skills: 3, mb: 2 }] };
      });
    } else {
      btn("Подключить", "primary", () => {
        state.handoff = { peer: peer.name, code: String(Math.floor(100000 + Math.random() * 899999)) };
      });
      const input = document.createElement("input");
      input.className = "code";
      input.placeholder = "код с другой машины";
      actions.append(input);
    }
    card.append(actions);
    list.append(card);
  });

  if (state.profiles) {
    const box = document.createElement("div");
    box.className = "peer";
    box.innerHTML = `<div class="meta">профили ${state.profiles.peer}</div>` +
      state.profiles.items.map((p) =>
        `<div class="row"><div><div class="nm">${p.name}</div>
         <div class="meta">скиллов ${p.skills} · ${p.mb} МБ</div></div>
         <button class="act primary">Импортировать</button></div>`).join("");
    list.append(box);
  }

  if (state.log) {
    const pre = document.createElement("pre");
    pre.className = "log";
    pre.textContent = state.log;
    list.append(pre);
  }
}

document.getElementById("search").onclick = () => {
  state.search = !state.search;
  render();
};
render();
</script>
</body>
</html>
